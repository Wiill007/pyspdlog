[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=3.1,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "pyspdlog"
version = "0.1.0"
description = "Fast C++ logging for Python: nanobind bindings for spdlog"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Will" }]
keywords = ["logging", "spdlog", "nanobind", "async", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Wiill007/spdlog-python-bindings"
Issues = "https://github.com/Wiill007/spdlog-python-bindings/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# abi3 wheel for Python >= 3.12; older versions get a regular wheel
wheel.py-api = "cp312"
sdist.exclude = [".github", "CLAUDE.md", "uv.lock"]

[tool.uv]
# Rebuild the extension on `uv sync` / `uv run` when the C++ or build files change
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "src/cpp/**/*.cpp" },
    { file = "src/cpp/**/*.h" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
# Threading bugs show up as hangs; fail instead of blocking CI forever
timeout = 120

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*"]
build-frontend = "build[uv]"
test-groups = ["dev"]
test-command = "pytest {project}/tests"

[tool.cibuildwheel.macos.environment]
# std::filesystem (used for path arguments) needs macOS 10.15
MACOSX_DEPLOYMENT_TARGET = "10.15"
